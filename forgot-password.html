<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сброс пароля | ECCO</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; background: #f9f9f9; }
    h2 { text-align: center; color: #d32f2f; margin-bottom: 10px; }
    p { text-align: center; color: #555; font-size: 0.95em; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #d32f2f; color: white; font-weight: bold; font-size: 1em; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .msg { padding: 12px; margin: 12px 0; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
    .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #d32f2f; text-decoration: none; font-size: 0.9em; }
  </style>
</head>
<body>
  <h2>Сброс пароля</h2>
  <p>Введите ваш email @ecco.com</p>

  <input id="email" type="email" placeholder="ivan@ecco.com" />
  <button onclick="sendReset()">Отправить ссылку</button>

  <div id="error" class="msg error"></div>
  <div id="success" class="msg success"></div>

  <div class="back">
    <a href="login.html">← Назад к входу</a>
  </div>

  <script type="module" src="forgot-password.js"></script>
</body>
</html>
