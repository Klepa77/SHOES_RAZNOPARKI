<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="container">
    <div class="logo"></div>
    <h2>Создание аккаунта</h2>
    <div class="form-group">
      <input type="text" id="fullName" placeholder="Полное имя">
    </div>
    <div class="form-group">
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Пароль">
      <div class="password-strength">
        <div class="strength-bar" id="passwordStrength"></div>
      </div>
      <div class="password-hint" id="passwordHint">
        Пароль должен содержать минимум 8 символов, включая цифры и буквы
      </div>
    </div>
    <div class="form-group">
      <input type="password" id="confirmPassword" placeholder="Подтвердите пароль">
    </div>
    <div class="terms">
      <input type="checkbox" id="agreeTerms">
      <label for="agreeTerms">
        Я принимаю <a href="#">условия использования</a> и <a href="#">политику конфиденциальности</a>
      </label>
    </div>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    <button id="registerBtn" onclick="register()" disabled>Зарегистрироваться</button>
    <div class="links">
      <p><a href="login.html">Уже есть аккаунт? Войдите</a></p>
    </div>
  </div>
<script type="module" src="register.js"></script>
</body>
</html>
